[project]
name = "xenius-docvault-backend"
version = "0.1.0"
description = "XENIUS DocVault FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "email-validator>=2.1,<3",
    "fastapi>=0.115,<1",
    "gunicorn>=22,<27",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "passlib>=1.7.4,<2",
    "pillow>=10.3,<13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "lancedb>=0.26,<1",
    "portalocker>=3,<4",
    "pyjwt>=2.8,<3",
    "pymupdf>=1.24,<2",
    "pypdf>=4.2,<7",
    "pytesseract>=0.3.10,<1",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.9,<1",
    "python-pptx>=1,<2",
    "pyyaml>=6,<7",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Heavy model/vector integrations remain production runtime capabilities, but
# are opt-in for local development and lightweight CI jobs.
ai = [
    "anthropic>=0.40,<1",
    "docling>=2,<3",
    "flagembedding>=1.2,<2",
    "qdrant-client>=1.9,<2",
    "sentence-transformers>=3,<6",
]
# The dual-encoder visual lane is kept separate from the broader RAG/Docling
# extra so a web-only deployment does not pull a 1.5 GB model runtime.
visual = [
    "accelerate>=1,<2",
    "safetensors>=0.5,<1",
    "torch>=2.6,<3",
    "transformers>=5,<6",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4,<1.10",
    "mypy>=2.3,<2.4",
    "pip-audit>=2.10.1,<2.11",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.15.22,<0.16",
]

[tool.uv]
package = false
required-version = "==0.11.9"
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 60
precision = 1
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# FastAPI intentionally declares dependency providers as default-value calls.
"app/deps.py" = ["B008"]
"app/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts", "tests"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
