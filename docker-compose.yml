# XENIUS DocVault — docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   backend   FastAPI + Gunicorn/Uvicorn (RAG pipeline, document ingestion)
#   frontend  React SPA served by Nginx (reverse-proxies /api → backend)
#
# Usage:
#   docker compose up -d           # start all services
#   docker compose up -d backend   # start only the API
#   docker compose logs -f backend # tail logs
#   docker compose down            # stop (data persisted in volumes)
#   docker compose down -v         # stop + wipe volumes (destructive!)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: "${DOCVAULT_BACKEND_IMAGE:-xenius-docvault-backend:latest}"
    container_name: docvault-backend
    restart: unless-stopped
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    env_file:
      - path: .env          # Copy .env.example → .env and fill in values
        required: false     # App validation fails closed if production values are absent
    expose:
      - "8000"            # private service port; the frontend is the public ingress
    ports:
      # Local-only direct access for Swagger (/docs), curl and Postman. Bound to
      # 127.0.0.1 so the API is never reachable from the network — the frontend
      # remains the only public ingress.
      - "127.0.0.1:8000:8000"
    environment:
      # ── Core ──
      DOCVAULT_ENVIRONMENT: "${DOCVAULT_ENVIRONMENT:-development}"
      DOCVAULT_DEBUG: "${DOCVAULT_DEBUG:-true}"
      DOCVAULT_ENABLE_DEMO_SEED: "${DOCVAULT_ENABLE_DEMO_SEED:-true}"
      DOCVAULT_DATABASE_URL: "${DOCVAULT_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/docvault}"
      DOCVAULT_STORAGE_DIR: "/data/storage"
      DOCVAULT_OKF_BUNDLE_DIR: "/data/okf_bundle"
      DOCVAULT_ACCESS_TOKEN_MINUTES: "${DOCVAULT_ACCESS_TOKEN_MINUTES:-480}"
      DOCVAULT_MAX_UPLOAD_MB: "${DOCVAULT_MAX_UPLOAD_MB:-50}"
      # ── Server-folder import (off until approved roots are mounted) ──
      DOCVAULT_FOLDER_IMPORT_ENABLED: "${DOCVAULT_FOLDER_IMPORT_ENABLED:-false}"
      DOCVAULT_FOLDER_IMPORT_ROOTS: '${DOCVAULT_FOLDER_IMPORT_ROOTS:-[]}'
      DOCVAULT_FOLDER_IMPORT_MAX_VISITED_ENTRIES: "${DOCVAULT_FOLDER_IMPORT_MAX_VISITED_ENTRIES:-5000}"
      DOCVAULT_FOLDER_IMPORT_MAX_FILES: "${DOCVAULT_FOLDER_IMPORT_MAX_FILES:-500}"
      DOCVAULT_FOLDER_IMPORT_MAX_TOTAL_MB: "${DOCVAULT_FOLDER_IMPORT_MAX_TOTAL_MB:-500}"
      DOCVAULT_FOLDER_IMPORT_MAX_DEPTH: "${DOCVAULT_FOLDER_IMPORT_MAX_DEPTH:-10}"
      DOCVAULT_FOLDER_IMPORT_MAX_SECONDS: "${DOCVAULT_FOLDER_IMPORT_MAX_SECONDS:-30}"
      # ── LLM provider ──
      DOCVAULT_LLM_PROVIDER: "${DOCVAULT_LLM_PROVIDER:-none}"
      DOCVAULT_ALLOW_EXTERNAL_LLM: "${DOCVAULT_ALLOW_EXTERNAL_LLM:-false}"
      DOCVAULT_LLM_ALLOWED_HOSTS: '${DOCVAULT_LLM_ALLOWED_HOSTS:-[]}'
      DOCVAULT_RAG_PROVIDER_CONNECT_TIMEOUT_SECONDS: "${DOCVAULT_RAG_PROVIDER_CONNECT_TIMEOUT_SECONDS:-3}"
      DOCVAULT_RAG_PROVIDER_READ_TIMEOUT_SECONDS: "${DOCVAULT_RAG_PROVIDER_READ_TIMEOUT_SECONDS:-20}"
      DOCVAULT_RAG_PROVIDER_TOTAL_TIMEOUT_SECONDS: "${DOCVAULT_RAG_PROVIDER_TOTAL_TIMEOUT_SECONDS:-30}"
      DOCVAULT_RAG_PROVIDER_MAX_OUTPUT_TOKENS: "${DOCVAULT_RAG_PROVIDER_MAX_OUTPUT_TOKENS:-512}"
      DOCVAULT_RAG_MAX_CONTEXT_BYTES: "${DOCVAULT_RAG_MAX_CONTEXT_BYTES:-32768}"
      DOCVAULT_RAG_PROVIDER_MAX_CONCURRENCY: "${DOCVAULT_RAG_PROVIDER_MAX_CONCURRENCY:-2}"
      DOCVAULT_VLLM_URL: "${DOCVAULT_VLLM_URL:-}"
      DOCVAULT_VLLM_MODEL: "${DOCVAULT_VLLM_MODEL:-gemma-4-31b}"
      DOCVAULT_OLLAMA_URL: "${DOCVAULT_OLLAMA_URL:-}"
      DOCVAULT_OLLAMA_MODEL: "${DOCVAULT_OLLAMA_MODEL:-gemma3:4b}"
      DOCVAULT_ANTHROPIC_API_KEY: "${DOCVAULT_ANTHROPIC_API_KEY:-}"
      DOCVAULT_ANTHROPIC_URL: "${DOCVAULT_ANTHROPIC_URL:-https://api.anthropic.com}"
      DOCVAULT_RAG_MODEL: "${DOCVAULT_RAG_MODEL:-claude-opus-4-8}"
      # ── MongoDB (Ask AI conversation persistence) ──
      DOCVAULT_MONGODB_URL: "mongodb://${MONGO_ROOT_USER:-mongoadmin}:${MONGO_ROOT_PASSWORD:-mongoadmin}@mongodb:27017/ask_ai?authSource=admin"
      # ── Google OAuth (for Drive integration) ──
      DOCVAULT_GOOGLE_CLIENT_ID: "${DOCVAULT_GOOGLE_CLIENT_ID:-617551129683-iakfnf5osk1oee12fh4p60o1oqhprkpa.apps.googleusercontent.com}"
      DOCVAULT_GOOGLE_CLIENT_SECRET: "${DOCVAULT_GOOGLE_CLIENT_SECRET:-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}"
      DOCVAULT_GOOGLE_REDIRECT_URI: "${DOCVAULT_GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/callback}"

      # ── RAG pipeline (local default uses the SQLite FTS5 fallback) ──
      DOCVAULT_USE_QDRANT: "${DOCVAULT_USE_QDRANT:-false}"
      # In-network service DNS; the host-facing URL in .env only applies to
      # non-Docker runs (the environment block overrides env_file here).
      DOCVAULT_QDRANT_URL: "http://qdrant:6333"
      DOCVAULT_LANCEDB_URI: "/data/lancedb"
      DOCVAULT_QDRANT_COLLECTION: "${DOCVAULT_QDRANT_COLLECTION:-docvault}"
      DOCVAULT_EMBEDDING_MODEL: "${DOCVAULT_EMBEDDING_MODEL:-BAAI/bge-m3}"
      DOCVAULT_RERANKER_MODEL: "${DOCVAULT_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}"
      # ── Docling (layout-aware parsing) ──
      DOCVAULT_USE_DOCLING: "${DOCVAULT_USE_DOCLING:-true}"
      # ── CORS (allow the Nginx frontend + Vite dev server) ──
      DOCVAULT_CORS_ORIGINS: '${DOCVAULT_CORS_ORIGINS:-["http://localhost", "http://localhost:80", "http://localhost:8080", "http://127.0.0.1:8080", "http://localhost:3000", "http://localhost:5173", "http://127.0.0.1:5173", "http://frontend"]}'
      # ── Gunicorn ──
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      # ── HuggingFace model cache (BGE-M3 + reranker) ──
      HF_TOKEN: "${HF_TOKEN:-}"
      # All HF libraries must agree on the same cache directory so that models
      # downloaded once (into the hf_cache volume) are reloaded — never re-downloaded.
      HF_HOME: "/hf_cache"
      TRANSFORMERS_CACHE: "/hf_cache"
      HF_DATASETS_CACHE: "/hf_cache/datasets"
      SENTENCE_TRANSFORMERS_HOME: "/hf_cache/sentence_transformers"
      TORCH_HOME: "/hf_cache/torch"
      # ── MinIO object storage ──
      DOCVAULT_STORAGE_BACKEND: "${DOCVAULT_STORAGE_BACKEND:-minio}"
      DOCVAULT_MINIO_ENDPOINT: "minio:9000"
      DOCVAULT_MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      DOCVAULT_MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      DOCVAULT_MINIO_SECURE: "false"
      DOCVAULT_MINIO_BUCKET_PREFIX: "${DOCVAULT_MINIO_BUCKET_PREFIX:-docvault}"
    volumes:
      - docvault_db:/data          # SQLite DB + storage + OKF bundle
      # Host bind-mounts. The defaults are relative to this compose file, so a
      # fresh clone works anywhere without configuration. Override either var in
      # .env with an absolute path to relocate the data (e.g. onto a larger disk).
      - ${LANCEDB_HOST_PATH:-./lancedb}:/data/lancedb # LanceDB tables (visual semantic + shadow lanes)
      - ${HF_CACHE_HOST_PATH:-./hf_cache}:/hf_cache   # HuggingFace model weights (BGE-M3, reranker)
      - ./backend/app:/app/app     # Hot reload for backend source code
      - ./.env:/app/.env           # Mount host .env file for dynamic admin settings persistence
    secrets:
      - docvault_secret_key
    networks:
      - docvault-net
      - docvault-data-net
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.container_healthcheck", "--ready"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Durable ingestion worker ──────────────────────────────────────────────
  # This process is intentionally separate from the HTTP workers. SQLite uses
  # one replica; approved PostgreSQL deployments may scale this service after
  # D-02/live locking verification.
  ingestion-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: "${DOCVAULT_BACKEND_IMAGE:-xenius-docvault-backend:latest}"
    container_name: docvault-ingestion-worker
    restart: unless-stopped
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      DOCVAULT_ENVIRONMENT: "${DOCVAULT_ENVIRONMENT:-development}"
      DOCVAULT_DATABASE_URL: "${DOCVAULT_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/docvault}"
      DOCVAULT_STORAGE_DIR: "/data/storage"
      DOCVAULT_OKF_BUNDLE_DIR: "/data/okf_bundle"
      DOCVAULT_USE_QDRANT: "${DOCVAULT_USE_QDRANT:-false}"
      DOCVAULT_QDRANT_URL: "http://qdrant:6333"
      DOCVAULT_LANCEDB_URI: "/data/lancedb"
      DOCVAULT_INGESTION_WORKER_COUNT: "${DOCVAULT_INGESTION_WORKER_COUNT:-1}"
      # ── MinIO object storage ──
      DOCVAULT_STORAGE_BACKEND: "${DOCVAULT_STORAGE_BACKEND:-minio}"
      DOCVAULT_MINIO_ENDPOINT: "minio:9000"
      DOCVAULT_MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      DOCVAULT_MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      DOCVAULT_MINIO_SECURE: "false"
      DOCVAULT_MINIO_BUCKET_PREFIX: "${DOCVAULT_MINIO_BUCKET_PREFIX:-docvault}"
      HF_HOME: "/hf_cache"
      TRANSFORMERS_CACHE: "/hf_cache"
      HF_DATASETS_CACHE: "/hf_cache/datasets"
      SENTENCE_TRANSFORMERS_HOME: "/hf_cache/sentence_transformers"
      TORCH_HOME: "/hf_cache/torch"
      # Model prefetch control
      HF_TOKEN: "${HF_TOKEN:-}"
      DOCVAULT_SKIP_MODEL_PREFETCH: "true"
    entrypoint: ["python", "-m", "app.worker"]
    volumes:
      - docvault_db:/data
      # Same host bind-mounts as the backend — see the note there.
      - ${LANCEDB_HOST_PATH:-./lancedb}:/data/lancedb
      - ${HF_CACHE_HOST_PATH:-./hf_cache}:/hf_cache
      - ./backend/app:/app/app:ro  # Mount source code for dev
    secrets:
      - docvault_secret_key
    depends_on:
      backend:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks:
      - docvault-data-net
    healthcheck:
      disable: true

  # One-shot operational roles. Run with `docker compose --profile ops run
  # --rm migration` (and similarly maintenance/backup); none shares the web
  # process command or HTTP listener.
  migration:
    profiles: ["ops"]
    image: "${DOCVAULT_BACKEND_IMAGE:-xenius-docvault-backend:latest}"
    entrypoint: ["/usr/local/bin/docvault-process"]
    command: ["migrate"]
    env_file: [{path: .env, required: false}]
    environment:
      DOCVAULT_DATABASE_URL: "${DOCVAULT_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/docvault}"
    volumes: ["docvault_db:/data"]
    secrets: [docvault_secret_key]
    networks: ["docvault-data-net"]

  maintenance:
    profiles: ["ops"]
    image: "${DOCVAULT_BACKEND_IMAGE:-xenius-docvault-backend:latest}"
    entrypoint: ["/usr/local/bin/docvault-process"]
    command: ["maintenance"]
    env_file: [{path: .env, required: false}]
    environment:
      DOCVAULT_DATABASE_URL: "${DOCVAULT_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/docvault}"
    volumes: ["docvault_db:/data"]
    secrets: [docvault_secret_key]
    networks: ["docvault-data-net"]

  backup:
    profiles: ["ops"]
    image: xenius-docvault-backend:latest
    entrypoint: ["/usr/local/bin/docvault-process"]
    command: ["backup"]
    env_file: [{path: .env, required: false}]
    environment:
      DOCVAULT_DATABASE_URL: "${DOCVAULT_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/docvault}"
      DOCVAULT_BACKUP_DESTINATION: "${DOCVAULT_BACKUP_DESTINATION:-}"
      DOCVAULT_BACKUP_QUIESCENT: "${DOCVAULT_BACKUP_QUIESCENT:-false}"
    volumes: ["docvault_db:/data"]
    secrets: [docvault_secret_key]
    networks: ["docvault-data-net"]

  qdrant:
    image: "${DOCVAULT_QDRANT_IMAGE:-qdrant/qdrant:latest}"
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - docvault-data-net


  # ── MinIO S3-compatible object storage ────────────────────────────────────
  minio:
    image: "minio/minio:latest"
    container_name: docvault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"   # MinIO console (local only)
    networks:
      - docvault-data-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5


  # One-shot service that creates the required buckets on first boot.
  minio-init:
    image: "minio/mc:latest"
    container_name: docvault-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        for bucket in docvault-staging docvault-unclassified docvault-quarantine docvault-tombstone; do
          mc mb --ignore-existing local/$$bucket;
        done;
        echo 'MinIO buckets ready';
      "
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    networks:
      - docvault-data-net

  postgres:
    image: "postgres:15-alpine"
    container_name: docvault-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docvault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docvault-data-net
      - docvault-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docvault"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── MongoDB (Ask AI conversation persistence) ─────────────────────────────
  mongodb:
    image: "mongo:7"
    container_name: docvault-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ask_ai
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:-mongoadmin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-mongoadmin}"
    volumes:
      - mongodb_data:/data/db
    networks:
      - docvault-data-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 5


  # ── React + Nginx frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    image: "${DOCVAULT_FRONTEND_IMAGE:-xenius-docvault-frontend:dev}"
    container_name: docvault-frontend
    restart: unless-stopped
    command: ["npm", "run", "dev"]
    # read_only: true  # Disabled for dev so Vite can write temporary files in /app
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,size=16m
      - /var/run:noexec,nosuid,size=1m
      - /tmp:noexec,nosuid,size=8m
    ports:
      - "8080:5173"       # Main entry point for users at http://localhost:8080
    environment:
      VITE_API_TARGET: "http://backend:8000"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - docvault-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3


# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  docvault_db:
    name: ddms_docvault_db
    driver: local
  # NOTE: hf_cache and lancedb_data are no longer named volumes. They are plain
  # host bind-mounts declared directly on the backend/worker services, defaulting
  # to ./hf_cache and ./lancedb next to this file. See ${HF_CACHE_HOST_PATH} and
  # ${LANCEDB_HOST_PATH} in .env.example to point them elsewhere.
  qdrant_data:
    name: ddms_qdrant_data
    driver: local
  postgres_data:
    driver: local
  minio_data:
    name: ddms_minio_data
    driver: local
  mongodb_data:
    name: ddms_mongodb_data
    driver: local


# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  docvault-net:
    driver: bridge

  # Database/vector traffic is isolated from the public-ingress network.
  # Egress/TLS policy for approved external providers remains a DEPLOY-003 gate.
  docvault-data-net:
    driver: bridge
    internal: true

secrets:
  docvault_secret_key:
    file: ./secrets/docvault_secret_key
 