# XENIUS DocVault — docker-compose.dev.yml
# ─────────────────────────────────────────────────────────────────────────────
# Development override — layered on top of docker-compose.yml via:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# What it does:
#   backend  — runs uvicorn with --reload; ./backend/app is bind-mounted so
#              any Python file save instantly restarts the worker.
#   frontend — runs the Vite HMR dev server on :5173; ./frontend/src is
#              bind-mounted so any React/TS change triggers instant HMR in
#              the browser (no full page reload for most changes).
#
# Ports exposed in dev:
#   http://localhost:8000  — FastAPI (direct, for testing with curl / Postman)
#   http://localhost:5173  — Vite dev server (the UI you open in browser)
#
# DO NOT use this file in production.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # Optional development-only vector provider. The base local profile uses
  # SQLite FTS5 and does not start this service.
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: docvault-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - docvault-data-net

  # ── Backend: uvicorn --reload ───────────────────────────────────────────────
  backend:
    ports:
      - "8000:8000"
    environment:
      DOCVAULT_DEBUG: "true"
      DOCVAULT_ENABLE_DEMO_SEED: "true"
      DOCVAULT_ENVIRONMENT: "development"
      DOCVAULT_USE_QDRANT: "true"
      DOCVAULT_QDRANT_URL: "http://qdrant:6333"
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      # Bind-mount the entire app package so code changes take effect instantly.
      # The named volumes declared in docker-compose.yml (docvault_db, hf_cache)
      # continue to be mounted — this just adds an extra bind-mount on top.
      - ./backend/app:/app/app:ro

  # ── Frontend: Vite HMR dev server ──────────────────────────────────────────
  frontend:
    # Override the production Nginx image with the node builder stage so we can
    # run `npm run dev` instead of serving a static bundle.
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder          # stop at the node:20-alpine builder stage
    image: xenius-docvault-frontend:dev
    # Replace the default Nginx CMD with the Vite dev server.
    command: ["npm", "run", "dev"]
    ports:
      - "5173:5173"            # Vite HMR port (replaces the Nginx :80 mapping)
    environment:
      # Proxy /api → backend service name (internal Docker network).
      VITE_API_TARGET: "http://backend:8000"
      # Vite needs this to allow connections from outside the container.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Bind-mount source so edits on the host are reflected instantly in Vite.
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      # Keep node_modules inside the container (do NOT bind-mount the host's).
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started   # dev: don't wait for healthcheck
      qdrant:
        condition: service_started
    healthcheck:
      # Vite dev server — check the HMR websocket port
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  ingestion-worker:
    environment:
      DOCVAULT_USE_QDRANT: "true"
      DOCVAULT_QDRANT_URL: "http://qdrant:6333"
    depends_on:
      qdrant:
        condition: service_started

volumes:
  qdrant_data:
    driver: local
