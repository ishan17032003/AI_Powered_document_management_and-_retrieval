services:
  backend:
    build: &id001
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCVAULT_BACKEND_IMAGE:-xenius-docvault-backend:latest}
    container_name: docvault-backend
    restart: unless-stopped
    user: 10001:10001
    cap_drop: &id002
    - ALL
    security_opt: &id003
    - no-new-privileges:true
    read_only: true
    tmpfs: &id004
    - /tmp:noexec,nosuid,size=64m
    env_file: &id005
    - path: .env
      required: false
    expose: &id006
    - '8000'
    environment: &id007
      DOCVAULT_ENVIRONMENT: development
      DOCVAULT_DEBUG: 'true'
      DOCVAULT_ENABLE_DEMO_SEED: 'true'
      DOCVAULT_DATABASE_URL: ${DOCVAULT_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/docvault}
      DOCVAULT_STORAGE_DIR: /data/storage
      DOCVAULT_OKF_BUNDLE_DIR: /data/okf_bundle
      DOCVAULT_ACCESS_TOKEN_MINUTES: ${DOCVAULT_ACCESS_TOKEN_MINUTES:-480}
      DOCVAULT_MAX_UPLOAD_MB: ${DOCVAULT_MAX_UPLOAD_MB:-50}
      DOCVAULT_FOLDER_IMPORT_ENABLED: ${DOCVAULT_FOLDER_IMPORT_ENABLED:-false}
      DOCVAULT_FOLDER_IMPORT_ROOTS: ${DOCVAULT_FOLDER_IMPORT_ROOTS:-[]}
      DOCVAULT_FOLDER_IMPORT_MAX_VISITED_ENTRIES: ${DOCVAULT_FOLDER_IMPORT_MAX_VISITED_ENTRIES:-5000}
      DOCVAULT_FOLDER_IMPORT_MAX_FILES: ${DOCVAULT_FOLDER_IMPORT_MAX_FILES:-500}
      DOCVAULT_FOLDER_IMPORT_MAX_TOTAL_MB: ${DOCVAULT_FOLDER_IMPORT_MAX_TOTAL_MB:-500}
      DOCVAULT_FOLDER_IMPORT_MAX_DEPTH: ${DOCVAULT_FOLDER_IMPORT_MAX_DEPTH:-10}
      DOCVAULT_FOLDER_IMPORT_MAX_SECONDS: ${DOCVAULT_FOLDER_IMPORT_MAX_SECONDS:-30}
      DOCVAULT_LLM_PROVIDER: ${DOCVAULT_LLM_PROVIDER:-none}
      DOCVAULT_ALLOW_EXTERNAL_LLM: ${DOCVAULT_ALLOW_EXTERNAL_LLM:-false}
      DOCVAULT_LLM_ALLOWED_HOSTS: ${DOCVAULT_LLM_ALLOWED_HOSTS:-[]}
      DOCVAULT_RAG_PROVIDER_CONNECT_TIMEOUT_SECONDS: ${DOCVAULT_RAG_PROVIDER_CONNECT_TIMEOUT_SECONDS:-3}
      DOCVAULT_RAG_PROVIDER_READ_TIMEOUT_SECONDS: ${DOCVAULT_RAG_PROVIDER_READ_TIMEOUT_SECONDS:-20}
      DOCVAULT_RAG_PROVIDER_TOTAL_TIMEOUT_SECONDS: ${DOCVAULT_RAG_PROVIDER_TOTAL_TIMEOUT_SECONDS:-30}
      DOCVAULT_RAG_PROVIDER_MAX_OUTPUT_TOKENS: ${DOCVAULT_RAG_PROVIDER_MAX_OUTPUT_TOKENS:-512}
      DOCVAULT_RAG_MAX_CONTEXT_BYTES: ${DOCVAULT_RAG_MAX_CONTEXT_BYTES:-32768}
      DOCVAULT_RAG_PROVIDER_MAX_CONCURRENCY: ${DOCVAULT_RAG_PROVIDER_MAX_CONCURRENCY:-2}
      DOCVAULT_VLLM_URL: ${DOCVAULT_VLLM_URL:-}
      DOCVAULT_VLLM_MODEL: ${DOCVAULT_VLLM_MODEL:-gemma-4-31b}
      DOCVAULT_OLLAMA_URL: ${DOCVAULT_OLLAMA_URL:-}
      DOCVAULT_OLLAMA_MODEL: ${DOCVAULT_OLLAMA_MODEL:-gemma3:4b}
      DOCVAULT_ANTHROPIC_API_KEY: ${DOCVAULT_ANTHROPIC_API_KEY:-}
      DOCVAULT_ANTHROPIC_URL: ${DOCVAULT_ANTHROPIC_URL:-https://api.anthropic.com}
      DOCVAULT_RAG_MODEL: ${DOCVAULT_RAG_MODEL:-claude-opus-4-8}
      DOCVAULT_USE_QDRANT: 'true'
      DOCVAULT_QDRANT_URL: http://qdrant:6333
      DOCVAULT_QDRANT_COLLECTION: ${DOCVAULT_QDRANT_COLLECTION:-docvault}
      DOCVAULT_EMBEDDING_MODEL: ${DOCVAULT_EMBEDDING_MODEL:-BAAI/bge-m3}
      DOCVAULT_RERANKER_MODEL: ${DOCVAULT_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      DOCVAULT_USE_DOCLING: ${DOCVAULT_USE_DOCLING:-true}
      DOCVAULT_CORS_ORIGINS: ${DOCVAULT_CORS_ORIGINS:-["http://localhost", "http://localhost:80",
        "http://localhost:3000", "http://localhost:5173", "http://127.0.0.1:5173",
        "http://frontend"]}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /hf_cache
      TRANSFORMERS_CACHE: /hf_cache
      HF_DATASETS_CACHE: /hf_cache/datasets
      SENTENCE_TRANSFORMERS_HOME: /hf_cache/sentence_transformers
      TORCH_HOME: /hf_cache/torch
    volumes: &id008
    - docvault_db:/data
    - hf_cache:/hf_cache
    - ./backend/app:/app/app:ro
    secrets: &id009
    - docvault_secret_key
    networks: &id010
    - docvault-net
    - docvault-data-net
    healthcheck: &id011
      test:
      - CMD
      - python
      - -m
      - app.container_healthcheck
      - --ready
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  ingestion-worker:
    build: &id018
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCVAULT_BACKEND_IMAGE:-xenius-docvault-backend:latest}
    container_name: docvault-ingestion-worker
    restart: unless-stopped
    user: 10001:10001
    cap_drop: &id019
    - ALL
    security_opt: &id020
    - no-new-privileges:true
    read_only: true
    tmpfs: &id021
    - /tmp:noexec,nosuid,size=64m
    env_file: &id022
    - path: .env
      required: false
    environment: &id023
      DOCVAULT_ENVIRONMENT: ${DOCVAULT_ENVIRONMENT:-production}
      DOCVAULT_DATABASE_URL: ${DOCVAULT_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/docvault}
      DOCVAULT_STORAGE_DIR: /data/storage
      DOCVAULT_OKF_BUNDLE_DIR: /data/okf_bundle
      DOCVAULT_USE_QDRANT: 'true'
      DOCVAULT_QDRANT_URL: http://qdrant:6333
      DOCVAULT_INGESTION_WORKER_COUNT: ${DOCVAULT_INGESTION_WORKER_COUNT:-1}
      HF_HOME: /hf_cache
      TRANSFORMERS_CACHE: /hf_cache
      SENTENCE_TRANSFORMERS_HOME: /hf_cache/sentence_transformers
      TORCH_HOME: /hf_cache/torch
    entrypoint: &id024
    - python
    - -m
    - app.worker
    volumes: &id025
    - docvault_db:/data
    - hf_cache:/hf_cache
    secrets: &id026
    - docvault_secret_key
    depends_on: &id027
      backend:
        condition: service_started
      qdrant:
        condition: service_started
    networks: &id028
    - docvault-data-net
    healthcheck: &id029
      disable: true
  migration:
    profiles:
    - ops
    image: ${DOCVAULT_BACKEND_IMAGE:-xenius-docvault-backend:latest}
    entrypoint:
    - /usr/local/bin/docvault-process
    command:
    - migrate
    env_file:
    - path: .env
      required: false
    environment:
      DOCVAULT_DATABASE_URL: ${DOCVAULT_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/docvault}
    volumes:
    - docvault_db:/data
    networks:
    - docvault-data-net
  maintenance:
    profiles:
    - ops
    image: ${DOCVAULT_BACKEND_IMAGE:-xenius-docvault-backend:latest}
    entrypoint:
    - /usr/local/bin/docvault-process
    command:
    - maintenance
    env_file:
    - path: .env
      required: false
    environment:
      DOCVAULT_DATABASE_URL: ${DOCVAULT_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/docvault}
    volumes:
    - docvault_db:/data
    networks:
    - docvault-data-net
  backup:
    profiles:
    - ops
    image: xenius-docvault-backend:latest
    entrypoint:
    - /usr/local/bin/docvault-process
    command:
    - backup
    env_file:
    - path: .env
      required: false
    environment:
      DOCVAULT_DATABASE_URL: ${DOCVAULT_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/docvault}
      DOCVAULT_BACKUP_DESTINATION: ${DOCVAULT_BACKUP_DESTINATION:-}
      DOCVAULT_BACKUP_QUIESCENT: ${DOCVAULT_BACKUP_QUIESCENT:-false}
    volumes:
    - docvault_db:/data
    networks:
    - docvault-data-net
  qdrant:
    image: ${DOCVAULT_QDRANT_IMAGE:-qdrant/qdrant:latest}
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:noexec,nosuid,size=32m
    volumes:
    - qdrant_data:/qdrant/storage
    networks:
    - docvault-data-net
  postgres:
    image: postgres:15-alpine
    container_name: docvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docvault
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - docvault-data-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d docvault
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: &id012
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    image: ${DOCVAULT_FRONTEND_IMAGE:-xenius-docvault-frontend:latest}
    container_name: docvault-frontend
    restart: unless-stopped
    read_only: true
    tmpfs: &id013
    - /var/cache/nginx:noexec,nosuid,size=16m
    - /var/run:noexec,nosuid,size=1m
    - /tmp:noexec,nosuid,size=8m
    ports: &id014
    - 80:80
    - 5173:5173
    depends_on: &id015
      backend:
        condition: service_started
      qdrant:
        condition: service_started
    networks: &id016
    - docvault-net
    healthcheck: &id017
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:5173
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
  qdrant-dev:
    image: qdrant/qdrant:v1.11.3
    container_name: docvault-qdrant
    restart: unless-stopped
    volumes:
    - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    ports:
    - 6333:6333
    - 6334:6334
    networks:
    - docvault-data-net
    profiles:
    - development
  backend-dev:
    build: *id001
    image: ${DOCVAULT_BACKEND_IMAGE:-xenius-docvault-backend:latest}
    container_name: docvault-backend
    restart: unless-stopped
    user: 10001:10001
    cap_drop: *id002
    security_opt: *id003
    read_only: true
    tmpfs: *id004
    env_file: *id005
    expose: *id006
    environment: *id007
    volumes: *id008
    secrets: *id009
    networks: *id010
    healthcheck: *id011
    ports:
    - 8000:8000
    depends_on:
      qdrant:
        condition: service_started
    profiles:
    - development
  frontend-dev:
    build: *id012
    image: xenius-docvault-frontend:dev
    container_name: docvault-frontend
    restart: unless-stopped
    read_only: true
    tmpfs: *id013
    ports: *id014
    depends_on: *id015
    networks: *id016
    healthcheck: *id017
    command:
    - npm
    - run
    - dev
    environment:
      VITE_API_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
    - ./frontend/src:/app/src:ro
    - ./frontend/index.html:/app/index.html:ro
    - /app/node_modules
    profiles:
    - development
  ingestion-worker-dev:
    build: *id018
    image: ${DOCVAULT_BACKEND_IMAGE:-xenius-docvault-backend:latest}
    container_name: docvault-ingestion-worker
    restart: unless-stopped
    user: 10001:10001
    cap_drop: *id019
    security_opt: *id020
    read_only: true
    tmpfs: *id021
    env_file: *id022
    environment: *id023
    entrypoint: *id024
    volumes: *id025
    secrets: *id026
    depends_on: *id027
    networks: *id028
    healthcheck: *id029
    profiles:
    - development
volumes:
  docvault_db:
    name: ddms_docvault_db
    external: true
  hf_cache:
    name: ddms_hf_cache
    external: true
  qdrant_data:
    name: ddms_qdrant_data
    external: true
  postgres_data:
    driver: local
networks:
  docvault-net:
    driver: bridge
  docvault-data-net:
    driver: bridge
    internal: true
secrets:
  docvault_secret_key:
    file: ./secrets/docvault_secret_key
