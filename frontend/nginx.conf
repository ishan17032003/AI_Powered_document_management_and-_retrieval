server {
    listen 80;
    server_name _;

    # ── Static SPA ────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets aggressively; HTML and JSON never cache.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API reverse proxy → backend container ─────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Large uploads and long LLM responses need relaxed timeouts.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        client_max_body_size  60m;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # Route all non-file requests to index.html so React Router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
